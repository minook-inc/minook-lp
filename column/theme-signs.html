<script>
/* ページを移動したときは先頭から表示する（#付きのリンクはその位置へ）。読み込み中に利用者が操作したら、それ以上は戻さない */
(function(){
  if('scrollRestoration' in history) history.scrollRestoration='manual';
  if(location.hash) return;
  var touched=false;
  ['wheel','touchstart','keydown','mousedown'].forEach(function(ev){
    window.addEventListener(ev,function(){touched=true;},{once:true,passive:true});
  });
  function top(){
    if(touched) return;
    window.scrollTo({top:0,left:0,behavior:'instant'});
    try{document.documentElement.scrollIntoView({block:'start',behavior:'instant'});}catch(e){}
  }
  top();
  document.addEventListener('DOMContentLoaded',top);
  window.addEventListener('load',top);
  window.addEventListener('pageshow',function(e){if(e.persisted){touched=false;top();}});
})();
</script>
